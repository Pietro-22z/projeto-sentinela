<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <meta name="viewport" content="width=x, initial-scale=1.0">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background-color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
}

/* Container principal */
.tv-container {
    display: flex;
    flex-direction: row;
    width: 95vw;
    height: 90vh;
    gap: 18px;
}

/* Painéis lado a lado */
.left-panel,
.right-panel {
    display: flex;
    flex-direction: column;
    gap: 18px;
    height: 100%;
}

.left-panel {
    width: 35%;
}

.right-panel {
    width: 65%;
}

/* Estilo geral dos elementos */
.box {
    background-color: #fff7f7;
    border: 4px solid #c62828;
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;

    box-shadow:
        0 4px 12px rgba(198, 40, 40, 0.12),
        inset 0 0 0 1px #f3b5b5;

    color: #8b1e1e;
}

/* Títulos */
.box-title {
    color: #c62828;
    font-size: 2.2vw;
    font-weight: bold;
    text-transform: uppercase;
    text-shadow: none;
    margin-bottom: 12px;
}

/* Local */
.local-box {
    flex: 1;
    border-color: #b71c1c;
}

.local-number {
    color: #c62828;
    font-size: 9vw;
    font-weight: bold;
    line-height: 1;
}

.local-type {
    color: #8b1e1e;
    font-size: 1.8vw;
    font-weight: bold;
    margin-top: 6px;
}

/* Histórico */
.history-box {
    flex: 1;
    justify-content: flex-start;
    align-items: flex-start;
}

.history-box .box-title {
    font-size: 1.8vw;
    align-self: center;
}

#history-list {
    list-style: none;
    width: 100%;
    color: #c62828;
    font-size: 1.5vw;
    font-weight: bold;
    text-align: left;
}

#history-list li {
    margin-bottom: 8px;
    border-bottom: 1px solid #efb0b0;
    padding-bottom: 5px;
}

/* Paciente */
.patient-box {
    flex: 3;
    border-color: #d32f2f;
}

.patient-name {
    color: #c62828;
    font-size: 6.5vw;
    font-weight: bold;
    line-height: 1.2;
    word-break: break-word;
}

/* Logo / Sistema */
.logo-box {
    flex: 1;
    border-color: #b71c1c;
}

.logo-text {
    color: #a51c30;
    font-size: 3.5vw;
    font-weight: bold;
    text-transform: uppercase;
}

/* Efeito de destaque */
@keyframes flash {
    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: 0.45;
    }
}

.flash {
    animation: flash 0.5s ease 3;
}

/* Ajuste para telas menores */
@media (max-width: 800px) {
    .tv-container {
        width: 96vw;
        height: 94vh;
        gap: 10px;
    }

    .left-panel,
    .right-panel {
        gap: 10px;
    }

    .box {
        padding: 10px;
        border-width: 3px;
    }

    .box-title {
        font-size: 3vw;
    }

    .local-number {
        font-size: 8vw;
    }

    .patient-name {
        font-size: 5.5vw;
    }

    .logo-text {
        font-size: 3vw;
    }
}

    <title> Midia Indoor - TV</title>
</head>

<body>
    <div class="tv-container">
        <div class="left-panel">
            <div class="box local-box">
                <div class="box-title" id="local-tipo"> GUICHE</div>
                <div class="local-number" id="local-numero">--</div>
            </div>

            <div class="box history-box">
                <div class="box-title">ULTIMAS CHAMADAS</div>
                <ul id="history-list"></ul>
            </div>

            <div class="right-panel">
                <div class="box patient-box">
                    <div class="box-title">PACIENTE</div>
                    <div class="patient-name" id="patient-name">AGUARDANDO...</div>

                    <div class="box logo-box">
                        <div class="logo-text">🏥Sistema Hospitalar</div>
                    </div>
                </div>
            </div>
</style>
<script>
                let ultimold = null;
                function atualizar() {
                    fetch("/tv/chamada")
                        .then(r => r.json())
                        .then(data => {
                            const chamada = data.chamada;
                            const historico = data.historico || [];

                            if (chamada) {
                                document.getElementById("local-tipo").innerText = chamada.localTipo || "GUICHE";
                                document.getElementById("local-numero").innerText = chamada.localTipo || "--";
                                document.getElementById("patient-name").innerText = chamada.localTipo || "AGUARDANDO...";

                                if (chamada.id !== ultimold) {
                                    ultimold = chamada.id
                                    const patientBox = document.querySelector(".patient-box");
                                    patientBox.classList.remove("flash");
                                    void patientBox.offseWidth;
                                    patientBox.classList.add("flash");
                                }
                            }
                            const list = document.getElementById(history - list);
                            list.innerHTML = "";
                            historico.slice(0, 4).forEach(h => {
                                const li = document.createElement("li");
                                const tipo = h.localTipo ? h.localTipo.substring(0, 4) : "GUIC";
                                li.innerText = `${tipo}.${h.localNumero} - ${h.pacient}`;
                                list.appendChild(li);
                            });
                        })
                        .catch(err => console.log("Erro ao buscar chamada:", err));

                }

                atualizar();
                setInterval(atualizar, 2000);

            </script>
</body>

</html>
