<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=x, initial-scale=1.0">
   <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background-color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
}

/* TODOS OS ELEMENTOS NA MESMA LINHA */
.tv-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    width: 95vw;
    height: 90vh;
    gap: 15px;
}

/* Remove a divisão dos painéis */
.left-panel,
.right-panel {
    display: contents;
}

/* Cada elemento ocupa uma coluna */
.box {
    width: 100%;
    height: 100%;

    background-color: #fff7f7;
    border: 4px solid #c62828;
    border-radius: 12px;

    padding: 20px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;

    box-shadow:
        0 5px 15px rgba(198, 40, 40, 0.15),
        inset 0 0 0 1px #f2b5b5;
}

/* Títulos */
.box-title {
    color: #c62828;
    font-size: 2vw;
    font-weight: bold;
    text-transform: uppercase;
    margin-bottom: 15px;
}

/* LOCAL */
.local-box {
    border-color: #b71c1c;
}

.local-number {
    color: #c62828;
    font-size: 7vw;
    font-weight: bold;
    line-height: 1;
}

.local-type {
    color: #8b1e1e;
    font-size: 1.6vw;
    font-weight: bold;
    margin-top: 10px;
}

/* HISTÓRICO */
.history-box {
    justify-content: flex-start;
    align-items: flex-start;
}

.history-box .box-title {
    font-size: 1.8vw;
    align-self: center;
}

#history-list {
    list-style: none;
    width: 100%;
    color: #c62828;
    font-size: 1.4vw;
    font-weight: bold;
    text-align: left;
}

#history-list li {
    margin-bottom: 10px;
    border-bottom: 1px solid #efb0b0;
    padding-bottom: 7px;
}

/* PACIENTE */
.patient-box {
    border-color: #d32f2f;
}

.patient-name {
    color: #c62828;
    font-size: 5vw;
    font-weight: bold;
    line-height: 1.1;
    word-break: break-word;
}

/* SISTEMA / LOGO */
.logo-box {
    border-color: #a51c30;
}

.logo-text {
    color: #a51c30;
    font-size: 2.8vw;
    font-weight: bold;
    text-transform: uppercase;
}

/* Animação */
@keyframes flash {
    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: 0.4;
    }
}

.flash {
    animation: flash 0.5s ease 3;
}

/* Telas menores */
@media (max-width: 900px) {
    .tv-container {
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        width: 98vw;
        height: 90vh;
    }

    .box {
        padding: 10px;
        border-width: 3px;
    }

    .box-title {
        font-size: 2.5vw;
    }

    .local-number {
        font-size: 6vw;
    }

    .patient-name {
        font-size: 4vw;
    }

    .logo-text {
        font-size: 2.5vw;
    }
}
 </style>
    <title> Midia Indoor - TV</title>
</head>

<body>
    <div class="tv-container">
        <div class="left-panel">
            <div class="box local-box">
                <div class="box-title" id="local-tipo"> GUICHE</div>
                <div class="local-number" id="local-numero">--</div>
            </div>

            <div class="box history-box">
                <div class="box-title">ULTIMAS CHAMADAS</div>
                <ul id="history-list"></ul>
            </div>

            <div class="right-panel">
                <div class="box patient-box">
                    <div class="box-title">PACIENTE</div>
                    <div class="patient-name" id="patient-name">AGUARDANDO...</div>

                    <div class="box logo-box">
                        <div class="logo-text">🏥Sistema Hospitalar</div>
                    </div>
                </div>
            </div>

<script>
                let ultimold = null;
                function atualizar() {
                    fetch("/tv/chamada")
                        .then(r => r.json())
                        .then(data => {
                            const chamada = data.chamada;
                            const historico = data.historico || [];

                            if (chamada) {
                                document.getElementById("local-tipo").innerText = chamada.localTipo || "GUICHE";
                                document.getElementById("local-numero").innerText = chamada.localTipo || "--";
                                document.getElementById("patient-name").innerText = chamada.localTipo || "AGUARDANDO...";

                                if (chamada.id !== ultimold) {
                                    ultimold = chamada.id
                                    const patientBox = document.querySelector(".patient-box");
                                    patientBox.classList.remove("flash");
                                    void patientBox.offseWidth;
                                    patientBox.classList.add("flash");
                                }
                            }
                            const list = document.getElementById(history - list);
                            list.innerHTML = "";
                            historico.slice(0, 4).forEach(h => {
                                const li = document.createElement("li");
                                const tipo = h.localTipo ? h.localTipo.substring(0, 4) : "GUIC";
                                li.innerText = `${tipo}.${h.localNumero} - ${h.pacient}`;
                                list.appendChild(li);
                            });
                        })
                        .catch(err => console.log("Erro ao buscar chamada:", err));

                }

                atualizar();
                setInterval(atualizar, 2000);

            </script>
</body>

</html>
